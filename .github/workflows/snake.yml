name: Refresh profile analytics

on:
  schedule:
    # 12 AM, 6 AM, 12 PM, and 6 PM in IST. GitHub cron uses UTC.
    - cron: "30 0,6,12,18 * * *"
    # Final streak checks at 11:59 AM and 11:59 PM IST.
    - cron: "29 6,18 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    # Cache-version commits only touch README.md. Do not launch a second
    # analytics job for those commits.
    paths-ignore:
      - README.md

permissions:
  contents: write

concurrency:
  group: profile-assets-output
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the profile repository
        uses: actions/checkout@v4
      - name: Generate cyber snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: EagleEye-xdata
          outputs: |
            dist/github-snake-light.svg?palette=github-light&color_snake=%2300B8D4&color_dots=%23e8edf2,%2387d69a,%2339a95b,%23238a47,%230d6b35
            dist/github-snake-cyber.svg?palette=github-dark&color_snake=%2300F0FF&color_dots=%23161b22,%230b3d2e,%23006d32,%2300a84f,%2339FF14
      - name: Crop the snake progress track
        run: python .github/scripts/clean_snake_svg.py dist/github-snake-light.svg dist/github-snake-cyber.svg
      - name: Generate self-hosted analytics cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: EagleEye-xdata
        run: python .github/scripts/generate_profile_cards.py
      - name: Publish analytics to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Bust GitHub profile image cache
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            ASSET_REF="$(git ls-remote origin refs/heads/output | cut -f1)"
            test -n "$ASSET_REF"
            export ASSET_REF
          python <<'PY'
          import os
          import re
          from pathlib import Path

          readme = Path("README.md")
          source = readme.read_text(encoding="utf-8")
          pattern = r"(https://raw\.githubusercontent\.com/EagleEye-xdata/EagleEye-xdata)/(?:output|[0-9a-f]{40})/([\w-]+\.svg)(?:\?v=\d+)?"
          updated = re.sub(pattern, lambda match: f"{match.group(1)}/{os.environ['ASSET_REF']}/{match.group(2)}", source)
          readme.write_text(updated, encoding="utf-8")
          PY
            if git diff --quiet -- README.md; then exit 0; fi
            git add README.md
            git commit -m "chore: refresh profile card cache"
            if git push; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
