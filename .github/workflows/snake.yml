name: Refresh profile analytics

on:
  schedule:
    # GitHub Actions uses UTC: 06:30 and 18:30 UTC = 12:00 PM and 12:00 AM IST.
    - cron: "30 6,18 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: profile-assets-output
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the profile repository
        uses: actions/checkout@v4
      - name: Generate self-hosted analytics cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: EagleEye-xdata
        run: python .github/scripts/generate_profile_cards.py
      - name: Publish analytics to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
